<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空き家ファインダー｜日本語で問いかけて探す格安空き家</title>
  <meta name="description" content="日本語で問いかけて全国の格安空き家・移住物件を探す。MLIT Project LINKS 空き家バンク登録物件データを使用。" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="topbar">
        <button id="lang-btn" type="button" class="lang-btn"></button>
      </div>
      <h1 data-i18n="appName">空き家ファインダー</h1>
      <p class="lead"><span data-i18n="lead">日本語で問いかけて探す、格安空き家・移住先。</span> <span id="mode-badge" class="badge"></span></p>

      <div class="search">
        <textarea id="query" rows="2" data-i18n-ph="placeholder" placeholder="例)予算300万以内、農地付き、海の近くで古民家"></textarea>
        <div class="search-actions">
          <button id="search-btn" class="primary" data-i18n="search">検索</button>
          <button id="clear-btn" class="ghost" data-i18n="clear">クリア</button>
        </div>
      </div>

      <div class="examples" id="examples"></div>
      <p id="lang-note" class="lang-note" data-i18n="keywordNote" hidden></p>
    </div>
  </header>

  <main class="wrap">
    <section class="controls">
      <div class="selects">
        <select id="pref-select" data-i18n-aria="prefAria" aria-label="都道府県"></select>
        <select id="muni-select" data-i18n-aria="muniAria" aria-label="市区町村" disabled></select>
      </div>
      <div class="summary">
        <span id="count" class="count">0件</span>
        <div id="chips" class="chips"></div>
      </div>
    </section>

    <p id="status" class="status"></p>

    <ul id="results" class="results"></ul>
    <div id="more" class="more" hidden>
      <button id="more-btn" type="button" class="more-btn"></button>
    </div>
  </main>

  <footer class="wrap foot">
    <p data-i18n-html="footerHtml">
      データ出典: 国土交通省 Project LINKS
      <a href="https://www.geospatial.jp/ckan/dataset/links-akiyabank-2025" target="_blank" rel="noopener noreferrer">空き家バンク登録物件(2025年度)</a>。
      物件の最新状況は各自治体バンク原典をご確認ください。
    </p>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/prompt.js"></script>
  <script src="assets/js/filter.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
